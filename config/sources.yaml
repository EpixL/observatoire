    endpoint_url: https://www.diplomatie.gouv.fr/fr/conseils-aux-voyageurs
    allowed_domains: [diplomatie.gouv.fr]
    poll_interval_s: 1800     # conditions non confirmées (site refait en 2026, un RSS déjà refusé en 403) : on ralentit
    licence: "Non confirmée (page mentions légales inaccessible depuis le cloud) : usage privé, pas de redistribution."
    quota_note: "Aucun quota publié. Respecter robots.txt. Canaux officiels documentés : application « Conseils aux voyageurs », compte X @ConseilsVoyages ; aucun flux RSS des conseils trouvé."
    verification_status: verified      # 2e smoke réel (Pi, 29/10/2026 17:58 UTC) : OK
    options:
      verified_on: "2026-10-29"
      content_selector: "main"
      expected_marker: "conseils aux voyageurs"   # contrôle positif : sinon « format inattendu »

