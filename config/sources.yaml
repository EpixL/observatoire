    allowed_domains: [easa.europa.eu]
    poll_interval_s: 600
    licence: "Réutilisation EASA : voir conditions du site (à vérifier)."
    quota_note: "Des flux RSS/JSON/CSV existent d'après la page EASA ; URL exacte à découvrir (discover-feeds). Pagination de la liste non vérifiée."
    verification_status: partially_verified   # page 200 + structure du tableau relevée sur le Pi ; reste à confirmer sur la page entière
    options:
      verified_on: "2026-10-29"

