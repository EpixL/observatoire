    poll_interval_s: 600
    licence: "Copyright (c) 2021-2025 Georgia Tech Research Corporation — All Rights Reserved (mention renvoyée par l'API). Conditions d'usage, conservation et redistribution à vérifier avant toute exploitation au-delà de l'usage privé."
    quota_note: "Limites d'API non documentées ici : 429 géré comme état technique."
    verification_status: partially_verified   # enveloppe de réponse confirmée (réponse réelle France : data=[]) ; forme d'un événement NON confirmée
    options:
      verified_on: "2026-10-29"
      lookback_hours: 48
      entities:
