# Registre des sources V1 (plan §3). Lu par le worker au démarrage (commande `sync-sources`).
#
# verification_status :
#   unverified_blocked  endpoint jamais atteint depuis l'environnement cloud (réseau filtré) :
#                       collecteur testé sur fixtures uniquement -> « à vérifier sur le Pi »
#   partially_verified  endpoint joignable depuis le Pi (smoke réel du 29/10/2026) mais format/contenu pas entièrement confirmé
#   verified            endpoint appelé avec succès ET format compris (preuve : smoke réel sur le Pi, options.verified_on)
#   blocked_by_site     le site refuse notre accès honnête (403, page anti-robot) : AUCUN contournement ; source désactivée
#                       avec son motif dans options.disabled_reason, en attente d'une source officielle alternative
#   to_discover         URL du flux inconnue ; utiliser `python -m app.cli discover-feeds`
#
# Cadences = poll_interval_s : volontairement prudentes (plan : RSS 2-5 min SI PERMIS ; pages 10-15 min).
# Elles sont à resserrer seulement après lecture des conditions d'utilisation et mesure sur le Pi.

defaults:
  default_tz: Europe/Paris      # fuseau supposé (et signalé "no_timezone") pour les dates sans fuseau
  retention_days: 90            # snapshots bruts (plan §16)
  priority: V1

sources:
  - id: france-diplomatie-cv
    name: France Diplomatie — Conseils aux voyageurs (page d'accueil, dernières minutes)
    organisation: Ministère de l'Europe et des Affaires étrangères
    source_type: autorite
    origin_family: fr-diplomatie
    zone: monde
    competence: Conseils aux voyageurs, consignes de sécurité à l'étranger
    languages: [fr]
    connector: html_page
    access_mode: html_page
    canonical_url: https://www.diplomatie.gouv.fr/fr/conseils-aux-voyageurs
    # SANS "/" final : avec "/", le site répond 301 vers http:// (port 80 fermé) — constaté sur le Pi le 29/10/2026.
    endpoint_url: https://www.diplomatie.gouv.fr/fr/conseils-aux-voyageurs
    allowed_domains: [diplomatie.gouv.fr]
    poll_interval_s: 900
    licence: "Licence Ouverte Etalab 2.0 (à confirmer pour ce contenu)"
    quota_note: "Aucun quota publié. Respecter robots.txt."
    verification_status: unverified_blocked
    options:
      content_selector: "main"
      expected_marker: "conseils aux voyageurs"   # contrôle positif : sinon « format inattendu »

  - id: france-diplomatie-rss
    name: France Diplomatie — flux RSS
    organisation: Ministère de l'Europe et des Affaires étrangères
    source_type: autorite
    origin_family: fr-diplomatie
    zone: monde
    competence: Actualités et dernières minutes (le flux RSS dédié aux conseils par pays reste à identifier)
    languages: [fr]
    connector: feed
    access_mode: feed
    canonical_url: https://www.diplomatie.gouv.fr/fr/conseils-aux-voyageurs/
    # URL SUPPOSÉE (flux général du site). À remplacer par le flux « conseils aux voyageurs »
    # trouvé via `python -m app.cli discover-feeds france-diplomatie-cv` sur le Pi.
    endpoint_url: https://www.diplomatie.gouv.fr/spip.php?page=backend&lang=fr
    allowed_domains: [diplomatie.gouv.fr]
    poll_interval_s: 300
    enabled: false
    licence: "Licence Ouverte Etalab 2.0 (à confirmer)"
    quota_note: "Aucun quota publié."
    verification_status: blocked_by_site
    options:
      disabled_reason: "HTTP 403 avec notre User-Agent honnête (smoke Pi 29/10/2026). Pas de contournement. Chercher le flux RSS officiellement documenté (FAQ voyage du site) ou garder la page conseils-aux-voyageurs comme voie principale."

  - id: easa-czib
